<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formatting examples.</title>
</head>
<body>
    <h1>Text Formatting Examples</h1>
    <p><b>Bold Text (using &lt;b&gt;)</b></p>
    <p><strong>Important Text (using &lt;strong&gt;)</strong></p>
    <p><italic>Italic Text (using &lt;italic&gt;)</italic></p>
    <p><em>Emphasized Text (using &lt;em&gt;)</em></p>
    <p><u>Underlined Text (using &lt;u&gt;)</u></p>
    <p><mark>Highlighted Text (using &lt;mark&gt;)</mark></p>
    <p><small>small Text (using &lt;small&gt;)</small></p>
    <p>H<sub>2</sub>O</p>
    <p>X<sup>2</sup></p>
    
</body>
</html>
